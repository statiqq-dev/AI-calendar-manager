[project]
name = "calendar-agent"
version = "0.1.0"
description = "AI-агент для управления календарём macOS на LangChain"
readme = "README.md"
authors = [
    { name = "german_sd", email = "stropus.gd@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4.6",
    "langchain-ollama>=1.1.0",
    "ollama>=0.6.3",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "pyobjc-framework-eventkit>=12.2.2 ; sys_platform == 'darwin'",
    "python-dotenv>=1.2.4",
]

[project.scripts]
calendar-agent = "calendar_agent.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.mypy]
# У PyObjC нет аннотаций типов: объекты EventKit для mypy — Any.
[[tool.mypy.overrides]]
module = ["EventKit", "Foundation"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
