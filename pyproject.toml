[project]
name = "calendar-agent"
version = "0.1.0"
description = "AI-агент для управления календарём macOS на LangChain"
readme = "README.md"
authors = [
    { name = "german_sd", email = "stropus.gd@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4.6",
    "langchain-ollama>=1.1.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
calendar-agent = "calendar_agent.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
